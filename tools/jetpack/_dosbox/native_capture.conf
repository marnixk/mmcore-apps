[sdl]
fullscreen=false
windowresolution=original
output=surface
showmenu=false

[render]
aspect=false
scaler=none

[cpu]
cycles=max

[mixer]
nosound=true

[midi]
mpu401=none
mididevice=none

[dos]
memsize=16

[dosbox]
captures=/workspace/tools/jetpack/reference/_native_shots

[autoexec]
@echo off
mount c /workspace/tools/jetpack/_download/extracted/jetpak15
c:
jetpack.exe
